<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    margin-bottom: 40px;
  }
  .build-card {
    width: 100%;
    max-width: 560px;
    background: #1c1c1e;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .build-card.collapsible { cursor: pointer; }
  .build-card.collapsible .build-header::after {
    content: "›";
    font-size: 22px;
    color: rgba(255,255,255,0.4);
    transform: rotate(90deg);
    transition: transform 0.2s;
  }
  .build-card.collapsed .build-header::after { transform: rotate(0deg); }
  .build-card.collapsed .collapsible-body { display: none; }
  .build-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .build-name {
    font-size: 18px;
    font-weight: 600;
  }
  .build-badge {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-queued { background: rgba(255,159,10,0.2); color: #ff9f0a; }
  .badge-running { background: rgba(10,132,255,0.2); color: #0a84ff; }
  .badge-success { background: rgba(48,209,88,0.2); color: #30d158; }
  .badge-failure { background: rgba(255,69,58,0.2); color: #ff453a; }
  .badge-unknown { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); }
  .progress-track {
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.8s ease, background-color 0.4s ease;
  }
  .fill-queued { background: #ff9f0a; }
  .fill-running { background: #0a84ff; }
  .fill-success { background: #30d158; }
  .fill-failure { background: #ff453a; }
  .build-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.6;
  }
  .build-meta a { color: #0a84ff; text-decoration: none; }
  .step-list {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    max-height: 180px;
    overflow-y: auto;
  }
  .step { padding: 3px 0; }
  .step .dot { margin-right: 8px; }
  a.step-link { display: block; color: inherit; text-decoration: none; border-radius: 6px; padding: 3px 6px; margin: 0 -6px; }
  a.step-link:hover { background: rgba(255,255,255,0.06); }
  a.step-link:active { background: rgba(255,255,255,0.10); }
  .dot-ok { color: #30d158; }
  .dot-run { color: #0a84ff; }
  .dot-fail { color: #ff453a; }
  .dot-wait { color: rgba(255,255,255,0.25); }
  .updated {
    margin-top: 32px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }
  .error { color: #ff453a; font-size: 15px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <h1>Build Status</h1>
  <div class="subtitle">Live progress for everything being built</div>
  <div id="tasks" style="width:100%;max-width:560px;"></div>
  <div id="build-notes" style="width:100%;max-width:560px;"></div>
  <div id="builds" style="width:100%;max-width:560px;"></div>
  <div id="history" style="width:100%;max-width:560px;"></div>
  <div class="updated" id="updated"></div>

<script>
const STATUS_URL = "https://raw.githubusercontent.com/thenosyt/AppleRemoteBridge-updates/main/build-status.json";
// Typical build takes ~12 min; used to estimate progress while running.
const TYPICAL_BUILD_MS = 12 * 60 * 1000;

function pctFor(build) {
  const state = build.state;
  if (state === "completed") return 100;
  if (state === "queued") return 6;
  if (state === "in_progress") {
    // Estimate from elapsed time vs typical build, clamped 8..95.
    // Also bump based on completed steps if we have them.
    let pct = 10;
    const steps = build.steps || [];
    const done = steps.filter(s => s.status === "completed").length;
    if (steps.length > 0) pct = Math.max(pct, Math.round((done / steps.length) * 88) + 8);
    if (build.created_at) {
      const elapsed = Date.now() - new Date(build.created_at).getTime();
      const timePct = Math.min(95, Math.round((elapsed / TYPICAL_BUILD_MS) * 100));
      pct = Math.max(pct, Math.min(timePct, 95));
    }
    return Math.min(95, pct);
  }
  return 4;
}

function badgeFor(build) {
  const state = build.state;
  const conclusion = build.conclusion;
  if (state === "completed") {
    if (conclusion === "success") return ["badge-success", "Done"];
    if (conclusion === "failure") return ["badge-failure", "Failed"];
    if (conclusion === "cancelled") return ["badge-unknown", "Cancelled"];
    return ["badge-unknown", conclusion || "Done"];
  }
  if (state === "in_progress") return ["badge-running", "Building"];
  if (state === "queued") return ["badge-queued", "Queued"];
  return ["badge-unknown", state || "Unknown"];
}

function fillClassFor(build) {
  const state = build.state;
  if (state === "completed") return build.conclusion === "success" ? "fill-success" : "fill-failure";
  if (state === "in_progress") return "fill-running";
  return "fill-queued";
}

function stepDot(step) {
  if (step.status === "completed") {
    return step.conclusion === "success"
      ? '<span class="dot dot-ok">●</span>'
      : '<span class="dot dot-fail">●</span>';
  }
  if (step.status === "in_progress") return '<span class="dot dot-run">●</span>';
  return '<span class="dot dot-wait">○</span>';
}

function buildTimeHtml(build) {
  if (!build.created_at) return "";
  const fmt = (iso) => {
    const d = new Date(iso);
    return d.toLocaleString("en-US", { timeZone: "America/Los_Angeles",
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
  };
  const started = fmt(build.created_at);
  let extra = "";
  if (build.updated_at && build.updated_at !== build.created_at) {
    const s = new Date(build.created_at), e = new Date(build.updated_at);
    const mins = Math.round((e - s) / 60000);
    const dur = mins < 1 ? "under a minute" : mins === 1 ? "1 min" : mins + " mins";
    const ended = fmt(build.updated_at);
    extra = ` · ended ${ended} (${dur})`;
  }
  return `<div class="build-meta" style="opacity:0.6;">Started ${started}${extra}</div>`;
}

function renderBuild(build) {
  const [badgeClass, badgeText] = badgeFor(build);
  const fillClass = fillClassFor(build);
  const pct = pctFor(build);
  const runUrl = build.html_url ? escapeHtml(build.html_url) : "";
  const steps = (build.steps || [])
    .filter(s => s.status === "in_progress" || s.status === "completed")
    .map(s => {
      const failed = s.conclusion === "failure";
      const inner = `${stepDot(s)}${escapeHtml(s.name)}${failed ? ' <span style="opacity:0.6;font-size:13px;">- tap to see logs</span>' : ''}`;
      if (runUrl) {
        const style = failed ? 'style="cursor:pointer;"' : 'style="cursor:pointer;opacity:0.85;"';
        return `<a href="${runUrl}" target="_blank" ${style} class="step step-link">${inner}</a>`;
      }
      return `<div class="step">${inner}</div>`;
    })
    .join("");
  const sha = build.sha ? ` <span>· ${escapeHtml(build.sha)}</span>` : "";
  const runLink = build.html_url
    ? ` <a href="${escapeHtml(build.html_url)}" target="_blank">View on GitHub</a>` : "";
  // Published (live) version, if available.
  let liveHtml = "";
  const pub = build.published;
  if (pub && pub.version) {
    const size = pub.apk_size ? ` (${(pub.apk_size / 1048576).toFixed(1)} MB)` : "";
    const apkState = pub.apk_ready ? "ready" : "not ready";
    liveHtml = `<div class="build-meta" style="margin-top:8px;color:#30d158;">Live: v${escapeHtml(pub.version)} · APK ${apkState}${size}</div>`;
  }
  return `
    <div class="build-card">
      <div class="build-header">
        <div class="build-name">${escapeHtml(build.name || build.repo || "Build")}</div>
        <div class="build-badge ${badgeClass}">${escapeHtml(badgeText)}</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${fillClass}" style="width:${pct}%"></div>
      </div>
      <div class="build-meta">${pct}%${sha}${runLink}</div>
      ${buildTimeHtml(build)}
      ${liveHtml}
      ${commitsHtml(build)}
      ${steps ? `<div class="step-list">${steps}</div>` : ""}
    </div>`;
}

function commitsHtml(build) {
  const commits = build.recent_commits || [];
  if (!commits.length) return "";
  const items = commits.map(c => {
    const msg = typeof c === "string" ? c : (c.message || "");
    return `<div class="step"><span class="dot" style="color:#0a84ff;">·</span>${escapeHtml(msg)}</div>`;
  }).join("");
  const uid = "commits-" + (build.run_id || Math.random().toString(36).slice(2));
  return `
    <div class="build-meta" style="margin-top:10px;">
      <a href="javascript:void(0)" onclick="document.getElementById('${uid}').style.display = document.getElementById('${uid}').style.display === 'none' ? 'block' : 'none'; this.querySelector('.toggle-arrow').textContent = document.getElementById('${uid}').style.display === 'none' ? '▸' : '▾';" style="color:#0a84ff;text-decoration:none;cursor:pointer;">
        <span class="toggle-arrow">▸</span> What changed in this build (${commits.length})
      </a>
    </div>
    <div id="${uid}" class="step-list" style="display:none;margin-top:4px;">${items}</div>`;
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderTasks(tasks, builds) {
  if (!tasks || !tasks.length) return "";
  // Calculate build progress from the latest build steps
  let buildPct = null, buildStep = "";
  if (builds && builds.length) {
    const b = builds[0];
    const steps = (b.steps || []).filter(s => !s.name.startsWith("Post "));
    const done = steps.filter(s => s.status === "completed").length;
    if (steps.length && b.state === "in_progress") {
      buildPct = Math.round(done / steps.length * 100);
      const cur = (b.steps || []).find(s => s.status === "in_progress");
      buildStep = cur ? cur.name : "";
    }
  }
  const items = tasks.map(t => {
    const done = t.done ? '<span class="dot dot-ok">✓</span>' : '<span class="dot dot-run">○</span>';
    const style = t.done ? 'opacity:0.55;text-decoration:line-through;' : '';
    let extra = "";
    if (t.build_task && buildPct !== null) {
      extra = `<div style="margin:6px 0 2px 28px;max-width:320px;">
        <div style="background:rgba(255,255,255,0.12);border-radius:6px;height:10px;overflow:hidden;">
          <div style="background:#0a84ff;height:10px;width:${buildPct}%;border-radius:6px;transition:width 0.5s;"></div>
        </div>
        <div style="font-size:13px;opacity:0.7;margin-top:4px;">${buildPct}%${buildStep ? " - " + escapeHtml(buildStep) : ""}</div>
      </div>`;
    }
    return `<div class="step" style="${style}">${done}${escapeHtml(t.label)}${extra}</div>`;
  }).join("");
  return `
    <div class="build-card">
      <div class="build-header">
        <div class="build-name">What I'm working on</div>
      </div>
      <div class="step-list" style="max-height:none;">${items}</div>
    </div>`;
}

function renderHistory(history) {
  if (!history || !history.length) return "";
  // Show newest first.
  const items = [...history].reverse().map(v => {
    const notes = v.notes ? ` <span style="opacity:0.5;">- ${escapeHtml(v.notes)}</span>` : "";
    return `<div class="step"><span class="dot dot-ok">●</span><strong>v${escapeHtml(v.version)}</strong> <span style="opacity:0.5;">${escapeHtml(v.date)}</span>${notes}</div>`;
  }).join("");
  return `
    <div class="build-card">
      <div class="build-header">
        <div class="build-name">Version history</div>
      </div>
      <div class="step-list" style="max-height:220px;">${items}</div></div>
    </div>`;
}

function renderBuildNotes(notes) {
  if (!notes || !notes.notes || !notes.notes.length) return "";
  const items = notes.notes.map(n =>
    `<div class="step"><span class="dot dot-run">·</span>${escapeHtml(n)}</div>`
  ).join("");
  return `
    <div class="build-card" style="border:1px solid rgba(10,132,255,0.3);">
      <div class="build-header">
        <div class="build-name">In this build (v${escapeHtml(notes.version)})</div>
        <div class="build-badge badge-running">Testing</div>
      </div>
      <div class="step-list" style="max-height:none;">${items}</div>
    </div>`;
}

async function load() {
  try {
    const res = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const builds = data.builds || [];
    document.getElementById("tasks").innerHTML = renderTasks(data.tasks, builds);
    document.getElementById("build-notes").innerHTML = renderBuildNotes(data.build_notes);
    document.getElementById("history").innerHTML = renderHistory(data.version_history);
    document.getElementById("builds").innerHTML =
      builds.length ? builds.map(renderBuild).join("")
                    : '<div class="error">No builds tracked yet.</div>';
    if (data.checked_at) {
      const d = new Date(data.checked_at);
      document.getElementById("updated").textContent =
        "Updated " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
  } catch (e) {
    document.getElementById("builds").innerHTML =
      '<div class="error">Could not load build status. Try again in a minute.</div>';
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
